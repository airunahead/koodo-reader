name: Sync Upstream (koodo-reader/koodo-reader)

permissions:
  contents: write

on:
  schedule:
    # 每天 UTC 时间 0:00 自动执行
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'koodo-reader/koodo-reader' }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: koodo-reader/koodo-reader
          upstream_sync_branch: dev
          target_sync_branch: dev
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false
